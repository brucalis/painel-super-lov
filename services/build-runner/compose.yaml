services:
  build-runner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      RUNNER_SECRET: ${RUNNER_SECRET}
      MAX_CONCURRENT_BUILDS: ${MAX_CONCURRENT_BUILDS:-1}
      BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS:-180000}
      BUILD_MEMORY: ${BUILD_MEMORY:-1g}
      BUILD_CPUS: ${BUILD_CPUS:-1}
      BUILD_IMAGE: ${BUILD_IMAGE:-node:22-alpine}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
