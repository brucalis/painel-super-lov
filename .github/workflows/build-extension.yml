name: Build extension ZIP

on:
  push:
    branches:
      - main
    paths:
      - "extension/**"
      - "extension-customer/**"
      - "scripts/build-extension.mjs"
      - ".github/workflows/build-extension.yml"
  workflow_dispatch:

concurrency:
  group: build-extension-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:extension
      - run: unzip -t public/super-lovable.zip
      - run: unzip -t public/super-lovable-admin-v32.0.44.zip
      - name: Publicar pacote atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/super-lovable.zip public/super-lovable-04.09.S1.zip public/super-lovable-admin-v32.0.44.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: atualizar pacotes das extensões 04.09.S1 e 32.0.44"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin main
